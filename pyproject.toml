[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-fraud-gnn"
version = "0.1.0"
description = "A temporal graph-learning pipeline for real-time fraud detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<3",
    "torch>=2.4,<3",
    "torch-geometric>=2.5,<3",
]
streaming = [
    "confluent-kafka>=2.5,<3",
    "fastapi>=0.115,<1",
    "streamlit>=1.57,<2",
    "uvicorn[standard]>=0.30,<1",
]
ops = [
    "mlflow>=2.16,<3",
]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]
all = [
    "real-time-fraud-gnn[ml,streaming,ops,test]",
]

[project.scripts]
fraud-gnn = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
